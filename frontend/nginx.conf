server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Strip /api/jobs, prepend /jobs → job-service
    # e.g. /api/jobs/search → /jobs/search
    location /api/jobs {
        rewrite ^/api/jobs(/.*)? /jobs$1 break;
        proxy_pass http://job-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Strip /api/candidate, prepend /candidate → candidate-service
    # e.g. /api/candidate/profile → /candidate/profile
    location /api/candidate {
        rewrite ^/api/candidate(/.*)? /candidate$1 break;
        proxy_pass http://candidate-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Strip /api/company, prepend /company → company-service
    # e.g. /api/company/ → /company/
    location /api/company {
        rewrite ^/api/company(/.*)? /company$1 break;
        proxy_pass http://company-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
